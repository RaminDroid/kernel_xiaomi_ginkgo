name: Compile Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configuring git environmert.
        run: |
           git config --global user.name note8hype
           git config --global user.email note8@hype.com
           
      - name: Building Kernel.
        run: |
            git clone --depth 1 https://${{ secrets.USERNAME }
            cd kernel
            chmod 777 build.sh
            ./build.sh

      - name: Uploading ZIP.
        run: |
            cd kernel
            curl -T *.zip https://pixeldrain.com/api/file/ && echo ""
